name: Aggiorna elenco titoli di Stato

on:
  schedule:
    - cron: '17 6 * * 1' # ogni lunedì alle 06:17 UTC; il MEF pubblica l'elenco una volta al mese
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-titoli-stato.js
      - run: npm test
      - name: Salva le novità e ripubblica il sito
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/; then
            echo "Elenco invariato."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/titoli-stato.json
          git commit -m "Aggiorna elenco titoli di Stato"
          git push
          # I push fatti con il token del workflow non avviano altri workflow: la pubblicazione va chiesta esplicitamente.
          gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
